colorScheme = "github"
defaultAppearance = "dark"
autoSwitchAppearance = true

enableSearch = true
enableCodeCopy = true
logo = "img/logo.svg"

[header]
  layout = "floating"
  logo = "img/logo.svg"
  showTitle = true

[homepage]
  layout = "landing"
  showRecent = false
  cardView = true

[article]
  showDate = true
  showAuthor = false
  showReadingTime = true
  showTableOfContents = true
  showBreadcrumbs = true

[list]
  showBreadcrumbs = true
  showTableOfContents = true
  cardView = true

[footer]
  showCopyright = true
  showTheme = false
